# Fossify launcher: the iOS ports bundled into one app. Build with `idl build -c release`.
# The apps are linked from their sibling checkouts (fossify-ios/*-ios) as static Swift modules.
toolchain:
  sdk_bundle: ~/.swiftpm/swift-sdks/darwin.artifactbundle
  swiftly_bin: ~/.local/share/swiftly/bin
  swiftc: swiftc
  ldid: ldid
  actool: idl-actool

defaults:
  min_ios: "17.0"
  swift_version: "5.0"

targets:
  - name: FossifyLauncher
    bundle_id: org.fossify.launcher.ios
    version: "1.0.0"
    build_number: "1"
    device_family: "1,2"
    link: [CalculatorKit, ContactsKit, FossifyCommons]
    sources: [Sources]
    resources: [Resources/Assets.xcassets]
    frameworks: [SwiftUI, UIKit, Foundation, Contacts, PhotosUI]
    info:
      CFBundleDisplayName: Fossify
      # Union of the bundled apps' Info.plist keys.
      NSContactsUsageDescription: Contacts needs access to your contacts to show, edit and back them up.
      NSCameraUsageDescription: Take a photo for a contact.
      UIFileSharingEnabled: true
      LSSupportsOpeningDocumentsInPlace: true
      UIApplicationSceneManifest:
        UIApplicationSupportsMultipleScenes: false
      UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
      UISupportedInterfaceOrientations~ipad:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
      CFBundleDocumentTypes:
        - CFBundleTypeName: vCard
          LSHandlerRank: Alternate
          LSItemContentTypes: [public.vcard]
    configurations:
      debug:
        entitlements:
          get-task-allow: true

  - name: CalculatorKit
    type: static
    dir: ../calculator-ios
    link: [FossifyCommons]
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation]

  - name: ContactsKit
    type: static
    dir: ../contacts-ios
    link: [FossifyCommons]
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation, Contacts, PhotosUI]

  - name: FossifyCommons
    type: static
    dir: ../commons-ios
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation]
