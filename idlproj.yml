  - name: PaintKit
    type: static
    dir: ../paint-ios
    link: [FossifyCommons]
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation, PhotosUI, UniformTypeIdentifiers]

  - name: PhoneKit
    type: static
    dir: ../phone-ios
    link: [FossifyCommons]
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation, Contacts, ContactsUI, CallKit, AudioToolbox, UniformTypeIdentifiers]

  - name: ThankYouKit
    type: static
    dir: ../thank-you-ios
    link: [FossifyCommons]
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation]

  - name: VoiceRecorderKit
    type: static
    dir: ../voice-recorder-ios
    link: [FossifyCommons]
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation, AVFoundation]

  - name: FossifyCommons
    type: static
