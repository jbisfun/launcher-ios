    frameworks: [SwiftUI, UIKit, Foundation, Photos, PhotosUI, AVKit, AVFoundation, CoreImage, PencilKit, LocalAuthentication]

  - name: KeyboardKit
    type: static
    dir: ../keyboard-ios
    link: [FossifyCommons]
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation, AudioToolbox, CoreText, UniformTypeIdentifiers]

  - name: MessagesKit
    type: static
    dir: ../messages-ios
    link: [FossifyCommons]
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation, Contacts, ContactsUI, MessageUI, PhotosUI, QuickLook, AVFoundation, UserNotifications, UniformTypeIdentifiers, LocalAuthentication]

  - name: MusicPlayerKit
    type: static
    dir: ../music-player-ios
    link: [FossifyCommons]
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation, AVFoundation, MediaPlayer]

  - name: NotesKit
    type: static
    dir: ../notes-ios
    link: [FossifyCommons]
    sources: [Sources]
