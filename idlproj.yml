# Fossify launcher: the iOS ports bundled into one app. Build with `idl build -c release`.
# The apps are linked from their sibling checkouts (fossify-ios/*-ios) as static Swift modules.
toolchain:
  sdk_bundle: ~/.swiftpm/swift-sdks/darwin.artifactbundle
  swiftly_bin: ~/.local/share/swiftly/bin
  swiftc: swiftc
  ldid: ldid
  actool: idl-actool

defaults:
  min_ios: "17.0"
  swift_version: "5.0"

targets:
  - name: FossifyLauncher
    bundle_id: org.fossify.launcher.ios
    version: "1.0.0"
    build_number: "1"
    device_family: "1,2"
    link: [CalculatorKit, CalendarKit, CameraKit, ClockKit, ContactsKit, DocumentsKit, FileManagerKit, GalleryKit, KeyboardKit,
           MessagesKit, MusicPlayerKit, NotesKit, PaintKit, PhoneKit, ThankYouKit, VoiceRecorderKit, FossifyCommons]
    sources: [Sources]
    # Holidays.bundle / CameraSounds.bundle: copies of calendar-ios' and camera-ios' Resources (idl resources must live
    # in the target dir).
    # Wallpapers.bundle: AOSP wallpapers (Apache-2.0, see its NOTICE) offered as home screen backgrounds.
    resources: [Resources/Assets.xcassets, Resources/AppIcons, Resources/Holidays.bundle, Resources/CameraSounds.bundle,
                Resources/Wallpapers.bundle]
    # Keyboard's system keyboard extension (KeyboardKit finds it as PlugIns/KeyboardExtension.appex).
    embed: [KeyboardExtension]
    frameworks: [SwiftUI, UIKit, Foundation, UniformTypeIdentifiers, Contacts, ContactsUI, PhotosUI, Photos, AVKit,
                 AVFoundation, AudioToolbox, ActivityKit, CoreImage, PencilKit, LocalAuthentication, EventKit,
                 UserNotifications, QuickLook, QuickLookThumbnailing, CryptoKit, ImageIO, MediaPlayer, MessageUI,
                 PDFKit, WebKit, CallKit, CoreLocation, CoreText]
    # Clock: AlarmKit is iOS 26+, weak so the launcher still runs on 17-25.
    ldflags: [-weak_framework, AlarmKit]
    info:
      CFBundleDisplayName: Fossify
      # Union of the bundled apps' Info.plist keys.
      NSContactsUsageDescription: Contacts, Phone, Messages and Calendar use your contacts to show, edit and back them up, call them, pick recipients and add birthdays.
      NSCameraUsageDescription: Camera takes photos and videos; Contacts, Messages and Gallery use it too.
      NSMicrophoneUsageDescription: Record audio with Voice Recorder, and the sound of videos and messages.
      NSPhotoLibraryUsageDescription: Gallery shows, organizes and edits your photos and videos; Messages attaches them.
      NSPhotoLibraryAddUsageDescription: Save photos, videos, edited photos and drawings to your photo library.
      NSLocationWhenInUseUsageDescription: Camera stores where a photo or video was taken when Save photo and video location is enabled.
      PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
      NSFaceIDUsageDescription: Unlock password protected apps, folders, notes and hidden items.
      NSCalendarsFullAccessUsageDescription: Calendar needs access to your calendars to show and edit the events of synced calendars.
      NSCalendarsUsageDescription: Calendar needs access to your calendars to show and edit the events of synced calendars.
      NSAlarmKitUsageDescription: Clock rings your alarms and timers, even in silent mode.
      NSAppleMusicUsageDescription: Music Player needs access to your music library to play the songs stored on this device.
      UIBackgroundModes: [audio]
      # Opened by the keyboard extension's settings / manage clipboard buttons.
      CFBundleURLTypes:
        - CFBundleURLName: org.fossify.launcher.ios.keyboard
          CFBundleURLSchemes: [fossify-keyboard]
      UIFileSharingEnabled: true
      LSSupportsOpeningDocumentsInPlace: true
      UIApplicationSceneManifest:
        UIApplicationSupportsMultipleScenes: false
      UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
      UISupportedInterfaceOrientations~ipad:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
      # Routed to an app by BundledApp.handling(_:).
      CFBundleDocumentTypes:
        - CFBundleTypeName: vCard
          LSHandlerRank: Alternate
          LSItemContentTypes: [public.vcard]
        - CFBundleTypeName: iCalendar
          LSHandlerRank: Alternate
          LSItemContentTypes: [com.apple.ical.ics, public.calendar-event]
        - CFBundleTypeName: Document
          LSHandlerRank: Alternate
          LSItemContentTypes: [com.adobe.pdf, org.openxmlformats.wordprocessingml.document, net.daringfireball.markdown,
                               public.comma-separated-values-text, public.tab-separated-values-text, public.html,
                               public.xhtml, public.plain-text, public.text, public.json, public.xml, public.yaml]
        - CFBundleTypeName: Audio
          LSHandlerRank: Alternate
          LSItemContentTypes: [public.audio]
        - CFBundleTypeName: Image
          CFBundleTypeRole: Editor
          LSHandlerRank: Alternate
          LSItemContentTypes: [public.image, public.svg-image]
        - CFBundleTypeName: File
          LSHandlerRank: Alternate
          LSItemContentTypes: [public.data, public.content]
    # Keyboard settings, pinned clips and colors shared with the keyboard extension.
    entitlements:
      com.apple.security.application-groups: [group.org.fossify.keyboard.ios]
    configurations:
      debug:
        entitlements:
          get-task-allow: true

  # The system keyboard (Settings > General > Keyboard > Keyboards > Add New Keyboard > Fossify Keyboard).
  - name: KeyboardExtension
    type: appex
    dir: ../keyboard-ios
    bundle_id: org.fossify.launcher.ios.keyboard
    version: "1.0.0"
    build_number: "1"
    device_family: "1,2"
    link: [KeyboardKit, FossifyCommons]
    sources: [Extension]
    frameworks: [SwiftUI, UIKit, Foundation, AudioToolbox, CoreText, UniformTypeIdentifiers]
    ldflags: [-e, _NSExtensionMain]
    info:
      CFBundleDisplayName: Fossify Keyboard
      NSExtension:
        NSExtensionPointIdentifier: com.apple.keyboard-service
        NSExtensionPrincipalClass: KeyboardViewController
        NSExtensionAttributes:
          IsASCIICapable: false
          PrefersRightToLeft: false
          PrimaryLanguage: mul
          RequestsOpenAccess: true
    entitlements:
      com.apple.security.application-groups: [group.org.fossify.keyboard.ios]

  - name: CalculatorKit
    type: static
    dir: ../calculator-ios
    link: [FossifyCommons]
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation]

  - name: CalendarKit
    type: static
    dir: ../calendar-ios
    link: [FossifyCommons]
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation, EventKit, Contacts, UserNotifications]

  - name: CameraKit
    type: static
    dir: ../camera-ios
    link: [FossifyCommons]
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation, AVFoundation, AVKit, Photos, CoreLocation, CoreImage, ImageIO, AudioToolbox, QuickLook]

  - name: ClockKit
    type: static
    dir: ../clock-ios
    link: [FossifyCommons]
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation, UserNotifications, AVFoundation, AudioToolbox, ActivityKit]

  - name: ContactsKit
    type: static
    dir: ../contacts-ios
    link: [FossifyCommons]
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation, Contacts, PhotosUI]

  - name: DocumentsKit
    type: static
    dir: ../documents-ios
    link: [FossifyCommons]
    sources: [Sources]
    frameworks: [SwiftUI, UIKit, Foundation, UniformTypeIdentifiers, PDFKit, WebKit]

  - name: FileManagerKit
